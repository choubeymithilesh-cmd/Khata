<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart AI Khatabook</title>
    <!-- Tailwind CSS for lightweight, adaptive UI -->
    <script src="https://tailwindcss.com"></script>
    <!-- Chart.js for lightweight analytics -->
    <script src="https://jsdelivr.net"></script>
    
    <!-- PWA Web Manifest Manifest Data URL for standalone mobile installation -->
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Smart%20AI%20Khatabook%22%2C%22short_name%22%3A%22Khatabook%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f3f4f6%22%2C%22theme_color%22%3A%22%23059669%22%7D">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased pb-12">

    <!-- Header / Branding Bar -->
    <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold flex items-center gap-1">📖 AI Khata Book</h1>
                <p class="text-xs text-emerald-100 font-mono">🔒 Device-Only Secure Engine</p>
            </div>
            <button onclick="toggleDashboard()" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all shadow-sm">
                📊 Toggle Dashboard
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 mt-4 space-y-4">
        
        <!-- Quick Log Input Card -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-sm font-bold text-gray-500 mb-2 uppercase tracking-wide">New Daily Entry</h2>
            <form id="entryForm" onsubmit="handleNewEntry(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Type naturally like a diary record:</label>
                    <input type="text" id="rawInput" required
                        placeholder="e.g., spent 450 for grocery or paid 30 for auto" 
                        class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-lg text-sm transition-colors shadow">
                    ✍️ Smart Log Entry
                </button>
            </form>
        </section>

        <!-- AI Interactive Dashboard Area -->
        <section id="dashboardSection" class="hidden bg-white p-4 rounded-xl shadow-sm border border-gray-100 transition-all space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="font-bold text-gray-700 text-sm uppercase tracking-wide">Category Split</h2>
                <span class="text-xs bg-emerald-50 text-emerald-700 font-semibold px-2 py-0.5 rounded-full">Live Dashboard</span>
            </div>
            <div class="relative max-h-48 flex justify-center">
                <canvas id="categoryChart"></canvas>
            </div>
            
            <!-- Dynamic AI Advisor Container -->
            <div class="bg-emerald-50 border border-emerald-100 rounded-lg p-3 text-xs text-emerald-900">
                <p class="font-bold mb-1">💡 AI Savings Advisor:</p>
                <p id="aiAdvisorText">Add standard expense transactions to get customized, category-specific savings strategies right here.</p>
            </div>
        </section>

        <!-- Historical Budgets / Previous Months Tabular View -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wide">Monthly Archive</h2>
                <select id="monthSelector" onchange="renderBudgetTable()" class="text-xs bg-gray-50 border rounded p-1 font-semibold text-gray-600">
                    <option value="current">Current Month</option>
                    <option value="previous">Previous Month</option>
                </select>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 uppercase tracking-wider text-[10px]">
                            <th class="p-2 rounded-l">Category</th>
                            <th class="p-2">Target Budget</th>
                            <th class="p-2 rounded-r">Actual Spent</th>
                        </tr>
                    </thead>
                    <tbody id="budgetTableBody" class="divide-y divide-gray-100">
                        <!-- Data injected dynamically by JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Transaction Ledger History -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-sm font-bold text-gray-500 mb-3 uppercase tracking-wide">Transaction Ledger</h2>
            <div id="ledgerList" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                <!-- Log entries injected dynamically -->
            </div>
        </section>

    </main>

    <!-- Native Platform PWA Setup Script -->
    <script>
        // Core Reactive Application State Variables
        let state = {
            transactions: JSON.parse(localStorage.getItem('khata_txs')) || [
                { id: 1, raw: "spent 1200 for groceries", amount: 1200, category: "Groceries", date: "2026-08-28" },
                { id: 2, raw: "paid 350 for uber ride", amount: 350, category: "Transport", date: "2026-08-27" },
                { id: 3, raw: "electricity bill 2400", amount: 2400, category: "Utilities", date: "2026-08-15" }
            ],
            budgets: {
                current: { "Groceries": 5000, "Transport": 2000, "Utilities": 4000, "Others": 1500 },
                previous: { "Groceries": 4500, "Transport": 2500, "Utilities": 3800, "Others": 2000 }
            }
        };

        let chartInstance = null;

        // Secure Rule-Based AI Natural Language Processing (Client-Side, Hyper-Fast)
        function analyzeExpenseAI(text) {
            const cleanText = text.toLowerCase();
            let amount = 0;
            
            // Extract numerical value securely using regular expression patterns
            const moneyMatch = cleanText.match(/\d+(\.\d+)?/);
            if (moneyMatch) amount = parseFloat(moneyMatch[0]);

            // Categorization logic based on text string semantics
            let category = "Others";
            if (/grocery|food|swiggy|zomato|milk|vegetable|starbucks/i.test(cleanText)) {
                category = "Groceries";
            } else if (/uber|ola|auto|metro|petrol|fuel|ride|cab/i.test(cleanText)) {
                category = "Transport";
            } else if (/bill|electricity|rent|wifi|recharge|water/i.test(cleanText)) {
                category = "Utilities";
            }

            return { amount, category };
        }

        // On-Device Client Generative Savings Logic (Privacy Compliant)
        function updateAISavingsAdvice(dominantCategory) {
            const tips = {
                "Groceries": "AI Insight: Wholesale planning could shave 12% off your food metrics next week. Consider bulk stores.",
                "Transport": "AI Insight: Your transport spending is indexing higher this week. Carpooling or off-peak booking recommended.",
                "Utilities": "AI Insight: Fixed bills detected. Auditing your standby power settings could decrease baseline metrics by 5%.",
                "Others": "AI Insight: Keep tracking items consistently to build a smarter, more accurate localized baseline profile."
            };
            document.getElementById('aiAdvisorText').innerText = tips[dominantCategory] || tips["Others"];
        }

        // Transaction handling and mutation loops
        function handleNewEntry(e) {
            e.preventDefault();
            const inputEl = document.getElementById('rawInput');
            const parsed = analyzeExpenseAI(inputEl.value);

            if (parsed.amount === 0) {
                alert("Please specify a numeric transaction amount in your sentence configuration.");
                return;
            }

            const newTx = {
                id: Date.now(),
                raw: inputEl.value,
                amount: parsed.amount,
                category: parsed.category,
                date: new Date().toISOString().split('T')[0]
            };

            state.transactions.unshift(newTx);
            localStorage.setItem('khata_txs', JSON.stringify(state.transactions));
            
            inputEl.value = '';
            renderApp();
        }

        function renderLedger() {
            const list = document.getElementById('ledgerList');
            list.innerHTML = state.transactions.map(tx => `
                <div class="flex justify-between items-center p-2.5 bg-gray-50 border rounded-lg text-xs">
                    <div>
                        <p class="font-medium text-gray-800">${tx.raw}</p>
                        <p class="text-[10px] text-gray-400 font-mono">${tx.date} • <span class="bg-gray-200 text-gray-700 px-1.5 py-0.2 rounded font-sans">${tx.category}</span></p>
                    </div>
                    <span class="font-bold text-red-600 text-sm">₹${tx.amount}</span>
                </div>
            `).join('');
        }

        function renderBudgetTable() {
